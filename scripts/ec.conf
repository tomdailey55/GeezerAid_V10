# Genius TV echo cancellation (Strix)
# Cancels the TV (HDMI) output from the JLAB mic so Jeeves doesn't hear its own
# replies (no feedback loop). Loaded into the MAIN PipeWire session.
#
# Place in ~/.config/pipewire/pipewire.conf.d/ec.conf
#
# module-echo-cancel creates a clean SOURCE (echo-cancel.source) + a SINK
# (echo-cancel.sink). Route Jeeves playback THROUGH echo-cancel.sink (which
# links to the HDMI output) and record from echo-cancel.source. The AEC then
# cancels whatever plays on the sink from the captured mic.
#
# IMPORTANT: the playback STREAM (echo-cancel-playback) must be pinned to the
# HDMI sink via playback.props.target.object. Without this it follows the
# system default sink (the USB DAC / HRTF for media+headphones) -> Jeeves'
# voice plays on the headphones and the mic hears it -> feedback loop.
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            # webrtc AEC engine (libspa-aec-webrtc.so present)
            aec.args = {
                aec.engine = webrtc
            }
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            source.props = {
                node.name = "echo-cancel.source"
                node.description = "Echo-Cancel Source (Genius TV)"
                media.class = "Audio/Source"
            }
            sink.props = {
                node.name = "echo-cancel.sink"
                node.description = "Echo-Cancel Sink (Genius TV)"
                media.class = "Audio/Sink"
                # target the TV HDMI output
                audio.output = "alsa_output.pci-0000_c5_00.1.hdmi-stereo"
            }
            playback.props = {
                node.name = "echo-cancel-playback"
                node.description = "Echo-Cancel Playback (Genius TV)"
                # PIN the playback stream to the HDMI sink so it never follows
                # the system default sink (USB DAC / HRTF for headphones).
                target.object = "alsa_output.pci-0000_c5_00.1.hdmi-stereo"
                node.dont-move = true
            }
        }
    }
]
