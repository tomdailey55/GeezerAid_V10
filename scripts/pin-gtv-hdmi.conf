# Pin GTV/Jeeves playback streams to the HDMI (TV) sink so they never follow
# the system default sink (which is the USB DAC / HRTF for media+headphones).
#
# Without this, echo-cancel-playback and gtv_dialogue.out re-route to the
# default sink on every PipeWire restart -> Jeeves' voice plays on the
# headphones and the mic hears it -> feedback loop.
#
# Loaded by WirePlumber (policy.node rules). Safe to delete to disable.
monitor.software.fallback = true

wireplumber.settings = {
  # keep the default sink as-is (HRTF/DAC for media); only pin these streams
}

# Pin the GTV/Jeeves playback stream nodes to the HDMI sink explicitly.
# node.target = the sink node.name they must link to.
policy.node.rules = [
  {
    matches = [
      { node.name = "~echo-cancel-playback" }
      { node.name = "~gtv_dialogue.out" }
    ]
    actions = [
      { update-props = {
          node.target = "alsa_output.pci-0000_c5_00.1.hdmi-stereo"
          node.dont-move = true
        }
      }
    ]
  }
]
