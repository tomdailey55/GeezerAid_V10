<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GA Desk</title>
<link rel="stylesheet" href="css/gtv.css">
<style>
/* GA-Desk dashboard pane: TV-first grid layout. Lives in index.html so no
   second page load / cache-bust dance is needed; hidden until .desk-open. */
#desk-pane {
    position: fixed; inset: 0; z-index: 40;
    display: none;               /* shown via body.desk-open */
    padding: 4vh 4vw;
    background: rgba(8, 10, 14, 0.96);
    color: #e8eaf0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
}
body.desk-open #desk-pane { display: block; }
body.desk-open #art-backdrop { opacity: 0.25; transition: opacity 1.2s; }

#desk-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 3vh 3vw;
    height: 88%;
}
.desk-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 2.6vh 2vw;
    overflow: hidden;
}
.desk-card h2 {
    margin: 0 0 1.4vh 0;
    font-size: 2.6vh;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(232,234,240,0.55);
}
#desk-cal   { grid-column: 1; grid-row: 1 / 3; }
#desk-todos { grid-column: 2; grid-row: 1; }
#desk-weath { grid-column: 2; grid-row: 2; }

.ev  { margin: 0 0 1.8vh 0; }
.ev .t  { font-size: 2.4vh; font-weight: 600; }
.ev .w  { font-size: 2.0vh; opacity: 0.65; }
.todo   { font-size: 2.4vh; margin: 0 0 1.4vh 0; }
.todo .done { opacity: 0.45; text-decoration: line-through; }
.desk-weather .big { font-size: 6vh; font-weight: 300; line-height: 1.1; }
.desk-weather .sm  { font-size: 2.2vh; opacity: 0.75; }

#desk-footer {
    position: fixed; left: 0; right: 0; bottom: 2.2vh;
    text-align: center;
    font-size: 1.9vh; opacity: 0.55; letter-spacing: 0.04em;
}
#desk-empty { opacity: 0.55; font-size: 2.4vh; }
</style>
</head>
<body>
<!-- Power-remote mode: art OFF by default. ?power=full restores the full
     art display (for powered/ambient screens). Remote battery devices load
     the plain page: clock/date/weather + PTT only, near-black screen. -->
<div id="art-backdrop" data-enabled="false">
    <img id="art-current" src="" alt="">
    <img id="art-next" src="" alt="">
    <div id="art-dim"></div>
</div>

<!-- Voice state (top-center) -->
<div id="voice-state">
    <div id="state-dot"></div>
    <div id="caption"></div>
</div>

<!-- Transcript -->
<div id="transcript"></div>

<!-- Suggestion -->
<div id="suggestion"></div>

<!-- Inline bar (migrates top/bottom) -->
<div id="info-bar" class="bottom">
    <div id="bar-row">
        <span class="bar-item" id="brand-start">GENIUS TV</span>
        <span class="bar-item" id="art-title"></span>
        <span class="bar-item" id="clock"></span>
        <span class="bar-item" id="date"></span>
        <span class="bar-item" id="weather"></span>
        <span class="bar-item" id="brand-end">GENIUS TV</span>
    </div>
</div>

<!-- GA-Desk dashboard pane (desk_open fills this; Hermes desktop can layer
     over the kiosk for real computer work) -->
<div id="desk-pane">
    <div id="desk-grid">
        <div class="desk-card" id="desk-cal">
            <h2>Today</h2>
            <div id="desk-cal-list"><div id="desk-empty">Loading…</div></div>
        </div>
        <div class="desk-card" id="desk-todos">
            <h2>Reminders</h2>
            <div id="desk-todo-list"><div id="desk-empty">Loading…</div></div>
        </div>
        <div class="desk-card desk-weather" id="desk-weath">
            <h2>Weather</h2>
            <div class="big" id="desk-weath-big">—</div>
            <div class="sm" id="desk-weath-sm"></div>
        </div>
    </div>
    <div id="desk-footer">Say “desk down” or “back to the art” when you’re done</div>
</div>

<!-- Exit button (top-right, revealed on tap) -->
<div id="exit-btn" onclick="window.gtv.quit()">✕</div>

<!-- Voice activation overlay (hidden until wake) -->
<div id="voice-overlay">
    <div id="voice-pulse"></div>
    <div id="voice-text">Listening…</div>
</div>

<script src="js/gtv.js?v=12"></script>
</body>
</html>
