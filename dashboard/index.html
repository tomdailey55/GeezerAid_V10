<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genius TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d0f13; color: #e8e6e1;
    font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
    display: flex; flex-direction: column;
    cursor: default;
  }

  /* ── tile grid ─────────────────────────────────────────── */
  #tiles { flex: 1; display: grid; gap: 14px; padding: 18px; min-height: 0; }
  #tiles.one  { grid-template-columns: 1fr; }
  #tiles.two  { grid-template-columns: 1fr 1fr; }
  #tiles.four { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .tile {
    background: #171b22; border: 1px solid #262c36; border-radius: 10px;
    padding: 18px 20px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0;
  }
  .tile.pad0 { padding: 0; }
  .tile h3 {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: #7f8797; font-weight: 600; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .badge {
    font-size: 10px; padding: 3px 9px; border-radius: 99px;
    border: 1px solid #37414f; color: #9aa4b4; letter-spacing: .08em;
  }
  .badge.live { border-color: #2f6f4f; color: #6ddf9f; }
  .badge.adb  { border-color: #6b5730; color: #e0b060; }

  .body { flex: 1; overflow-y: auto; min-height: 0; }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: #2b323d; border-radius: 4px; }

  h2.title { font-size: 26px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; }
  .meta { font-size: 13px; color: #8b93a1; margin-bottom: 16px; }
  .sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
         color: #6b7484; margin: 18px 0 8px; }
  ul, ol { list-style: none; font-size: 15px; line-height: 1.9; }
  ul li { padding-left: 16px; position: relative; }
  ul li::before { content: "◦"; position: absolute; left: 0; color: #6b7484; }
  ol { counter-reset: step; }
  ol li { padding-left: 30px; position: relative; margin-bottom: 10px; }
  ol li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 0; top: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid #37414f; color: #9aa4b4;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  ol li.on::before { border-color: #2f6f4f; color: #6ddf9f; }
  ol li.on { color: #fff; }
  b, strong { color: #fff; font-weight: 600; }

  iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; display: block; }

  /* Video tiles: give the YouTube player a correct 16:9 box and centre it.
   * The player letterboxes/pillarboxes vertical or 4:3 content itself, so we
   * do NOT need per-video aspect metadata — we just must not stretch it. */
  .vwrap {
    flex: 1; min-height: 0; display: flex;
    align-items: center; justify-content: center;
    background: #000; border-radius: 10px; overflow: hidden;
  }
  .vwrap .ar {
    width: 100%; aspect-ratio: 16 / 9; max-height: 100%;
    position: relative;
  }
  .vwrap .ar iframe { position: absolute; inset: 0; border-radius: 0; }

  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #6b7484; text-align: center; padding: 40px;
  }
  .empty .big { font-size: 20px; color: #8b93a1; }
  .empty .hint { font-size: 14px; line-height: 1.9; }
  .empty .hint span { color: #9aa4b4; }

  /* ── bottom bar ────────────────────────────────────────── */
  #bar {
    flex-shrink: 0; border-top: 1px solid #262c36; background: #0f1218;
    padding: 12px 20px; font-size: 14px; color: #9aa4b4;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
  }
  #said { color: #e8e6e1; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #6ddf9f; }
  #dot.busy { background: #e0b060; }
  #dot.off  { background: #4a5464; }
  #clock { font-variant-numeric: tabular-nums; color: #7f8797; }
</style>
</head>
<body>
  <div id="tiles" class="one"></div>
  <div id="bar">
    <span id="said">Dashboard ready, sir.</span>
    <span id="status"><span id="clock"></span><span id="dot"></span><span>Jeeves</span></span>
  </div>
<script src="dashboard.js"></script>
</body>
</html>
